[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-expiry-ledger"
version = "1.2.0"
description = "麦麦到期清单：把麦当劳账户里所有会过期的券、积分、抽奖与奖品放到同一张倒计时表上"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ztword" }]
keywords = ["mcdonalds", "mcp", "model-context-protocol", "expiry", "ledger"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# Deliberately empty: the package runs on the standard library only.
dependencies = []

[project.urls]
Homepage = "https://github.com/ztword/mcd-expiry-ledger"
Repository = "https://github.com/ztword/mcd-expiry-ledger"
Issues = "https://github.com/ztword/mcd-expiry-ledger/issues"
"Contest Entry" = "https://github.com/M-China/mcd-developer-innovation-challenge/issues/155"

[project.scripts]
mcd-expiry-ledger = "mcd_expiry_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["mcd_expiry_ledger*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
